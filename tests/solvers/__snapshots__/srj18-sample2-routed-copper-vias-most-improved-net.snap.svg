ta-type="rect" data-label="" data-x="43.2006" data-y="-6.3522" x="1426.3320543399354" y="134.1981541014207" width="53.59328009955425" height="53.59328009955405" fill="rgba(128, 0, 128, 0.2)" stroke="black" stroke-width="0.03172039473684211"/></g><g><rect data-type="rect" data-label="" data-x="45.7406" data-y="-6.3522" x="1506.4067199004458" y="134.1981541014207" width="53.59328009955425" height="53.59328009955405" fill="rgba(128, 0, 128, 0.2)" stroke="black" stroke-width="0.03172039473684211"/></g><g><rect data-type="rect" data-label="" data-x="43.2006" data-y="-8.8922" x="1426.3320543399354" y="214.27281966193087" width="53.59328009955425" height="53.59328009955408" fill="rgba(128, 0, 128, 0.2)" stroke="black" stroke-width="0.03172039473684211"/></g><g><rect data-type="rect" data-label="" data-x="45.7406" data-y="-8.8922" x="1506.4067199004458" y="214.27281966193087" width="53.59328009955425" height="53.59328009955408" fill="rgba(128, 0, 128, 0.2)" stroke="black" stroke-width="0.03172039473684211"/></g><g><rect data-type="rect" data-label="" data-x="43.2006" data-y="-11.4322" x="1426.3320543399354" y="294.3474852224411" width="53.59328009955425" height="53.59328009955402" fill="rgba(128, 0, 128, 0.2)" stroke="black" stroke-width="0.03172039473684211"/></g><g><rect data-type="rect" data-label="" data-x="45.7406" data-y="-11.4322" x="1506.4067199004458" y="294.3474852224411" width="53.59328009955425" height="53.59328009955402" fill="rgba(128, 0, 128, 0.2)" stroke="black" stroke-width="0.03172039473684211"/></g><g><rect data-type="rect" data-label="" data-x="43.2006" data-y="-13.9722" x="1426.3320543399354" y="374.42215078295135" width="53.59328009955425" height="53.59328009955408" fill="rgba(128, 0, 128, 0.2)" stroke="black" stroke-width="0.03172039473684211"/></g><g><rect data-type="rect" data-label="" data-x="45.7406" data-y="-13.9722" x="1506.4067199004458" y="374.42215078295135" width="53.59328009955425" height="53.59328009955408" fill="rgba(128, 0, 128, 0.2)" stroke="black" stroke-width="0.03172039473684211"/></g><g><rect data-type="rect" data-label="" data-x="43.2006" data-y="-16.5122" x="1426.3320543399354" y="454.49681634346143" width="53.59328009955425" height="53.593280099554136" fill="rgba(128, 0, 128, 0.2)" stroke="black" stroke-width="0.03172039473684211"/></g><g><rect data-type="rect" data-label="" data-x="45.7406" data-y="-16.5122" x="1506.4067199004458" y="454.49681634346143" width="53.59328009955425" height="53.593280099554136" fill="rgba(128, 0, 128, 0.2)" stroke="black" stroke-width="0.03172039473684211"/></g><circle data-type="circle" data-label="" data-x="32.968" data-y="-8.735" cx="1130.541283832832" cy="236.11365757544326" r="4.7288188323135945" fill="blue" stroke="black" stroke-width="0.03172039473684211"/><circle data-type="circle" data-label="" data-x="32.9" data-y="-9.614" cx="1128.39755262885" cy="263.8245359328009" r="4.7288188323135945" fill="blue" stroke="black" stroke-width="0.03172039473684211"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1600" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1600');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":31.525458882090632,"c":0,"e":91.20995540806814,"b":0,"d":-31.525458882090632,"f":-39.26122575961841};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>